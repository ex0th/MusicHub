[project]
name = "musichub-backend"
version = "0.1.0"
description = "MusicHub – self-hosted, plattformunabhängige Musikverwaltung (Backend/API)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0,<3",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pyjwt[crypto]>=2.9",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]

[project.scripts]
musichub-serve = "musichub.serve:main"
musichub-worker = "musichub.jobs.worker:main"
musichub-migrate = "musichub.db.migrate:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/musichub"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "db: Test benötigt eine laufende PostgreSQL-Datenbank (TEST_DATABASE_URL)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "B008",    # FastAPI Depends() in Defaults ist idiomatisch
    "RUF001",  # deutsche Typografie (–, „“) in Strings
    "RUF002",
    "RUF003",
]
