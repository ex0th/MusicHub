# nginx-Konfiguration des Frontend-Containers: statische Dateien + Proxy für /api.
# Wird beim Build fest ins Image kopiert (read-only Container, kein envsubst nötig).
# Upstream ist der Compose-Service "backend"; Docker-DNS (127.0.0.11) erlaubt
# Neustarts des Backends ohne nginx-Neustart. Die Adresse wird höchstens 1 s gecacht
# (je nginx-Worker): Nach einem Update bekommt das neue Backend oft eine andere IP, mit
# längerem Cache landeten Anfragen noch Sekunden später bei der alten Adresse (502).
resolver 127.0.0.11 valid=1s ipv6=off;

# Echte Client-Adresse hinter dem Reverse Proxy (Nginx Proxy Manager o. Ä.). Vertraut wird
# nur X-Forwarded-For von privaten Adressen (Docker-Netze, LAN, localhost) – Clients aus
# dem Internet können ihre Adresse so nicht fälschen.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
set_real_ip_from 127.0.0.1;
set_real_ip_from fc00::/7;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# Rate-Limits je Client-Adresse (Antwort 429)
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=auth:1m rate=20r/m;
map $request_method $upload_key {
    POST    $binary_remote_addr;
    default "";
}
limit_req_zone $upload_key zone=upload:1m rate=10r/m;
limit_req_status 429;
limit_req_log_level warn;

map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    # Importe: Backend-Grenze MUSICHUB_IMPORT_MAX_BYTES (Standard 10 MB) plus Formular-Overhead
    client_max_body_size 12m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Swagger-UI (/api/docs) lädt Skripte von jsdelivr – nur dort erlaubt, siehe location.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # Gemeinsame Proxy-Einstellungen für das Backend (X-Forwarded-For wird überschrieben,
    # nicht verlängert: das Backend sieht genau die von set_real_ip_from ermittelte Adresse)
    set $backend http://backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-Request-ID $request_id;
    proxy_read_timeout 60s;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        limit_req zone=api burst=80 nodelay;
        proxy_pass $backend;
    }

    # Anmeldung: strenger begrenzt (Backend begrenzt zusätzlich, MUSICHUB_AUTH_RATE_LIMIT_PER_MINUTE)
    location /api/auth/ {
        limit_req zone=auth burst=20 nodelay;
        limit_req zone=api burst=80 nodelay;
        proxy_pass $backend;
    }

    # Datei-Uploads (Import): wenige pro Minute
    location = /api/v1/imports {
        limit_req zone=upload burst=5 nodelay;
        limit_req zone=api burst=80 nodelay;
        proxy_pass $backend;
    }

    # Health-Checks ohne Access-Log und ohne Rate-Limit (Monitoring, Docker)
    location /api/health/ {
        access_log off;
        proxy_pass $backend;
    }

    location = /api/docs {
        proxy_pass $backend;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; connect-src 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        try_files $uri $uri/index.html $uri/ =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    }
}
